<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Gift Spin Wheel</title>
    <script>
        // Detect if the page was refreshed/reloaded and close or lock it immediately
        (function() {
            const navEntries = performance.getEntriesByType && performance.getEntriesByType('navigation');
            const isReload = (navEntries && navEntries.length > 0 && navEntries[0].type === 'reload') ||
                             (window.performance && window.performance.navigation && window.performance.navigation.type === 1);

            if (isReload) {
                window.close();
                // Fallback if browser security prevents window.close() on non-script-opened tabs
                document.addEventListener('DOMContentLoaded', function() {
                    document.body.innerHTML = `
                        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0a0b14;color:#ff416c;text-align:center;padding:20px;font-family:'Segoe UI',sans-serif;">
                            <h1 style="font-size:2rem;margin-bottom:12px;">SESSION CLOSED</h1>
                            <p style="color:#ffffff;font-size:1.1rem;">Page was refreshed. Your reward session has been closed and invalidated.</p>
                        </div>
                    `;
                });
            }
        })();
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(10, 11, 20, 0.82), rgba(10, 11, 20, 0.88)),
                        url('https://images.unsplash.com/photo-1594938298603-c8148c4dae35?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            padding: 16px;
            z-index: 2;
            width: 100%;
            max-width: 460px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 65, 108, 0.3);
        }

        p.subtitle {
            color: #8a8dbe;
            margin-bottom: 20px;
            font-size: 0.95rem;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Unified Single Page Container Card */
        .single-page-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 16px;
            padding: 20px 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bill-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }

        .bill-input-group input {
            background: #25283d;
            border: 1px solid #414568;
            color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            outline: none;
            width: 100%;
            max-width: 280px;
            text-align: center;
        }

        .bill-input-group button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            transition: transform 0.2s ease;
        }

        .bill-input-group button:active {
            transform: scale(0.97);
        }

        /* Wheel Stage */
        .wheel-stage {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .wheel-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 10px auto;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .wheel-pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 26px solid #ffd700;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.7));
            z-index: 10;
        }

        canvas#giftWheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #ffd700;
            box-shadow: 0 0 24px rgba(255, 215, 0, 0.35), 0 10px 25px rgba(0, 0, 0, 0.7);
            transition: transform 1.6s cubic-bezier(0.15, 0.85, 0.2, 1);
            display: block;
        }

        .wheel-center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff416c, #ff4b2b);
            border: 3px solid #ffd700;
            color: #fff;
            font-weight: 900;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            z-index: 5;
            pointer-events: none;
        }

        /* Multi-Spin Live Status Box */
        .spin-progress-box {
            margin-top: 15px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .spin-counter-text {
            font-size: 0.95rem;
            color: #ffd700;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .current-won-badge {
            display: inline-block;
            background: linear-gradient(45deg, #00ffd0, #009432);
            color: #08101e;
            font-weight: 900;
            font-size: 1rem;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(0, 255, 208, 0.3);
        }

        /* Final Summary View */
        .summary-section {
            display: none;
            width: 100%;
            animation: fadeIn 0.5s ease forwards;
        }

        .summary-title {
            font-size: 1.1rem;
            color: #00ffd0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 0 12px rgba(0, 255, 208, 0.5);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            max-height: 220px;
            overflow-y: auto;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.85rem;
            font-weight: 700;
            text-align: left;
        }

        .summary-badge {
            background: linear-gradient(45deg, #ffd700, #ff9900);
            color: #201400;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .summary-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #ffffff;
        }

        .disabled {
            cursor: not-allowed !important;
            opacity: 0.6;
        }

        /* Blinking Warning Caption Style */
        .blink-warning {
            font-weight: bold;
            color: #ff0000;
            animation: blinker 1s linear infinite;
            margin-top: 15px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GLAMOUR'S REWARD SYSTEM</h1>
        <p class="subtitle" id="status-text">Enter bill amount to unlock gifts (1 Gift per ₹1000)</p>

        <!-- Unified Single Page Container Card -->
        <div class="single-page-card">
            
            <!-- Bill Amount Input View -->
            <div class="bill-input-group" id="billInputSection">
                <input type="number" id="billAmount" placeholder="Enter Bill Amount (₹)" min="1000" inputmode="numeric">
                <button onclick="initializeRewards()">Start Spin & Unlock</button>
            </div>

            <!-- Spin Wheel Stage View -->
            <div class="wheel-stage" id="wheelStage">
                <div class="wheel-wrapper" id="wheelWrapper" onclick="triggerMultiSpinSequence()">
                    <div class="wheel-pointer"></div>
                    <canvas id="giftWheel" width="300" height="300"></canvas>
                    <div class="wheel-center-btn" id="wheelCenterText">SPIN</div>
                </div>

                <div class="spin-progress-box">
                    <div class="spin-counter-text" id="spinCounterText">Ready to spin!</div>
                    <div class="current-won-badge" id="currentWonBadge">Tap Wheel to Begin</div>
                </div>
            </div>

            <!-- Final Summary View -->
            <div class="summary-section" id="summarySection">
                <p class="summary-title">🎉 Rewards You've Won 🎉</p>
                <div class="summary-grid" id="summaryGrid"></div>
            </div>

        </div>

        <!-- Blinking Warning Caption -->
        <div class="blink-warning">REFRESHING THE PAGE WILL CLOSE AND INVALIDATE YOUR GIFT</div>
    </div>

    <script>
        function closeOrLockPage() {
            window.close();
            document.body.innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0a0b14;color:#ff416c;text-align:center;padding:20px;font-family:'Segoe UI',sans-serif;">
                    <h1 style="font-size:2rem;margin-bottom:12px;">SESSION CLOSED</h1>
                    <p style="color:#ffffff;font-size:1.1rem;">Page refresh detected. Your reward session has been closed and invalidated.</p>
                </div>
            `;
        }

        // Immediately close/lock page if refresh shortcut keys (F5, Ctrl+R, Cmd+R) are pressed
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F5' || (e.ctrlKey && e.key.toLowerCase() === 'r') || (e.metaKey && e.key.toLowerCase() === 'r')) {
                e.preventDefault();
                closeOrLockPage();
            }
        });

        const defaultGifts = [
            { name: "MAGIC LED BULB", weight: 15 },
            { name: "WATER BOTTLE", weight: 15 },
            { name: "COFFEE MUG", weight: 0 },
            { name: "CUP SET", weight: 0 },
            { name: "LADIES BAG", weight: 25 },
            { name: "UMBRELLA", weight: 15 },
            { name: "TRAY", weight: 20 },
            { name: "GENTS BAG", weight: 15 },
            { name: "WALL CLOCK", weight: 15 },
            { name: "WRIST WATCH", weight: 0 },
            { name: "FAN", weight: 0 }
        ];

        const oneTimeItems = ["CUP SET", "LADIES BAG", "FAN"];

        let currentGiftPool = [];
        let totalEligibleGifts = 0;
        let wonGiftsList = [];
        let billAmountValue = 0;
        let wheelRotation = 0;
        let isSpinning = false;
        let currentSpinIndex = 0;

        function drawWheel(items) {
            const canvas = document.getElementById('giftWheel');
            const ctx = canvas.getContext('2d');
            const numSegments = items.length;
            const arc = (2 * Math.PI) / numSegments;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX - 4;

            const colors = [
                '#ff416c', '#1e3799', '#ff9900', '#0c2461',
                '#e84393', '#009432', '#6f1e51', '#0652dd',
                '#d63031', '#1b1464', '#f79f1f'
            ];

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            items.forEach((gift, i) => {
                const startAngle = i * arc - Math.PI / 2;
                const endAngle = startAngle + arc;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#0a0b14';
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px "Segoe UI", sans-serif';
                ctx.shadowColor = 'rgba(0,0,0,0.85)';
                ctx.shadowBlur = 4;
                ctx.fillText(gift.name, radius - 14, 4);
                ctx.restore();
            });
        }

        function initializeRewards() {
            const billInput = document.getElementById('billAmount');
            const amount = parseFloat(billInput.value);
            const statusText = document.getElementById('status-text');

            if (isNaN(amount) || amount < 1000) {
                alert("Minimum bill amount must be ₹1000 to earn a gift!");
                return;
            }

            const lastAmount = localStorage.getItem('last_bill_amount');
            const lastTime = localStorage.getItem('last_bill_time');
            const currentTime = new Date().getTime();

            if (lastAmount && lastTime && parseFloat(lastAmount) === amount) {
                const elapsedSeconds = (currentTime - parseFloat(lastTime)) / 1000;
                if (elapsedSeconds < 70) {
                    const remaining = Math.ceil(70 - elapsedSeconds);
                    alert(`This bill amount was already entered recently. Please wait ${remaining} seconds before trying again.`);
                    return;
                }
            }

            localStorage.setItem('last_bill_amount', amount);
            localStorage.setItem('last_bill_time', currentTime);

            billAmountValue = amount;
            totalEligibleGifts = Math.floor(amount / 1000);
            wonGiftsList = [];
            currentSpinIndex = 0;

            if (amount >= 1000 && amount <= 1250) {
                currentGiftPool = [
                    { name: "MAGIC LED BULB", weight: 35 },
                    { name: "WATER BOTTLE", weight: 35 },
                    { name: "TRAY", weight: 20 },
                    { name: "GENTS BAG", weight: 10 },
                    { name: "WALL CLOCK", weight: 15 },
                    { name: "UMBRELLA", weight: 10 }
                ];
            } else {
                currentGiftPool = JSON.parse(JSON.stringify(defaultGifts));
                const clockRef = currentGiftPool.find(g => g.name === "WALL CLOCK");
                if (clockRef) {
                    clockRef.weight = (amount <= 2999) ? 15 : 15;
                }
            }

            for (let i = 0; i < totalEligibleGifts; i++) {
                wonGiftsList.push(getWeightedGift());
            }

            if (billAmountValue > 4000) {
                if (!wonGiftsList.includes("WALL CLOCK")) {
                    const replaceIdx = Math.floor(Math.random() * wonGiftsList.length);
                    wonGiftsList[replaceIdx] = "WALL CLOCK";
                }
            }

            if (billAmountValue > 8000) {
                ["WALL CLOCK", "GENTS BAG"].forEach(item => {
                    let count = wonGiftsList.filter(g => g === item).length;
                    while (count < 2 && wonGiftsList.length > 0) {
                        const replaceIdx = Math.floor(Math.random() * wonGiftsList.length);
                        wonGiftsList[replaceIdx] = item;
                        count = wonGiftsList.filter(g => g === item).length;
                    }
                });
            }

            drawWheel(currentGiftPool);

            document.getElementById('billInputSection').style.display = 'none';
            document.getElementById('wheelStage').style.display = 'flex';
            statusText.textContent = `Unlocked ${totalEligibleGifts} Gift(s)! Tap the wheel once to start spinning.`;
            document.getElementById('spinCounterText').textContent = `Spin 1 of ${totalEligibleGifts}`;
            document.getElementById('currentWonBadge').textContent = 'Ready to spin';
        }

        function getWeightedGift() {
            const totalWeight = currentGiftPool.reduce((sum, item) => sum + item.weight, 0);
            let selectedItemName = currentGiftPool[0].name;

            if (totalWeight <= 0) {
                const fallbackGifts = ["WATER BOTTLE", "UMBRELLA"];
                selectedItemName = fallbackGifts[Math.floor(Math.random() * fallbackGifts.length)];
            } else {
                let random = Math.random() * totalWeight;
                for (const gift of currentGiftPool) {
                    if (random < gift.weight) {
                        selectedItemName = gift.name;
                        break;
                    }
                    random -= gift.weight;
                }
            }

            if (oneTimeItems.includes(selectedItemName)) {
                const itemRef = currentGiftPool.find(g => g.name === selectedItemName);
                if (itemRef) itemRef.weight = 0;
            }

            return selectedItemName;
        }

        function playWheelSpinTickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                for (let i = 0; i < 14; i++) {
                    setTimeout(() => {
                        try {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(600 + Math.random() * 300, audioCtx.currentTime);
                            
                            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                            
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            
                            osc.start();
                            osc.stop(audioCtx.currentTime + 0.04);
                        } catch(e){}
                    }, i * 90);
                }
            } catch (e) {}
        }

        function sendToGoogleSheet(gifts, billAmount) {
            const scriptURL = 'https://script.google.com/macros/s/AKfycbzZtvulwMB89fFzErZncsQiNoRthw-8ZmEFg-UFPDa0vghSsq5X4o6l39-dkrfRuer8PA/exec';

            const payload = {
                date: new Date().toLocaleString(),
                billAmount: billAmount,
                gifts: gifts
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log('Sheet Sync Error:', err));
        }

        function triggerMultiSpinSequence() {
            if (isSpinning || currentSpinIndex >= totalEligibleGifts) return;
            isSpinning = true;

            const wheelCanvas = document.getElementById('giftWheel');
            const statusText = document.getElementById('status-text');
            const spinCounterText = document.getElementById('spinCounterText');
            const currentWonBadge = document.getElementById('currentWonBadge');
            const wheelWrapper = document.getElementById('wheelWrapper');

            wheelWrapper.classList.add('disabled');

            function executeSingleSpin() {
                if (currentSpinIndex >= totalEligibleGifts) {
                    sendToGoogleSheet(wonGiftsList, billAmountValue);
                    statusText.textContent = "All spins completed successfully!";
                    
                    setTimeout(() => {
                        document.getElementById('wheelStage').style.display = 'none';
                        const summarySection = document.getElementById('summarySection');
                        const summaryGrid = document.getElementById('summaryGrid');

                        summaryGrid.innerHTML = wonGiftsList.map((item, idx) => `
                            <div class="summary-item">
                                <span class="summary-badge">#${idx + 1}</span>
                                <span class="summary-name">${item}</span>
                            </div>
                        `).join('');

                        summarySection.style.display = 'block';
                    }, 800);
                    return;
                }

                const targetGiftName = wonGiftsList[currentSpinIndex];
                const numSegments = currentGiftPool.length;
                const segmentDeg = 360 / numSegments;
                const targetIndex = currentGiftPool.findIndex(g => g.name === targetGiftName);
                const sliceCenterAngle = (targetIndex >= 0 ? targetIndex : 0) * segmentDeg + (segmentDeg / 2);
                const targetLandingMod = (360 - sliceCenterAngle) % 360;
                const currentMod = wheelRotation % 360;
                const extraAngle = (targetLandingMod - currentMod + 360) % 360;

                wheelRotation += (360 * 3) + extraAngle;
                wheelCanvas.style.transform = `rotate(${wheelRotation}deg)`;

                playWheelSpinTickSound();

                statusText.textContent = `Spinning for Gift #${currentSpinIndex + 1} of ${totalEligibleGifts}...`;
                spinCounterText.textContent = `Spin ${currentSpinIndex + 1} of ${totalEligibleGifts}`;
                currentWonBadge.textContent = "Spinning...";

                setTimeout(() => {
                    currentWonBadge.textContent = `Won: ${targetGiftName}`;
                    currentSpinIndex++;

                    if (currentSpinIndex < totalEligibleGifts) {
                        setTimeout(() => {
                            executeSingleSpin();
                        }, 600);
                    } else {
                        executeSingleSpin();
                    }
                }, 1600);
            }

            executeSingleSpin();
        }
    </script>
</body>
</html>
