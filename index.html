<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mystery Gift Reveal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1c29 0%, #10111a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            overscroll-behavior: none;
        }

        .container {
            text-align: center;
            padding: 24px 16px 40px;
            z-index: 2;
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 65, 108, 0.3);
        }

        p.subtitle {
            color: #8a8dbe;
            margin-bottom: 20px;
            font-size: 0.95rem;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Bill Input Section */
        .bill-input-card {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .bill-input-card input {
            background: #25283d;
            border: 1px solid #414568;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            width: 160px;
        }

        .bill-input-card button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .bill-input-card button:hover {
            transform: scale(1.05);
        }

        /* ==================== TREASURE CHEST DESIGN & ANIMATION ==================== */
        .gift-container {
            position: relative;
            width: 200px;
            height: 180px;
            margin: 0 auto;
            cursor: pointer;
            perspective: 900px;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }

        /* Ambient ground shadow */
        .gift-container::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 24px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.75) 0%, rgba(212, 175, 55, 0.2) 40%, transparent 75%);
            border-radius: 50%;
            z-index: 1;
            transition: all 0.4s ease;
        }

        /* Chest Base / Body */
        .gift-box {
            position: relative;
            width: 170px;
            height: 100px;
            margin: 60px auto 0 auto;
            background: repeating-linear-gradient(
                180deg,
                #6e3a17 0px,
                #50260c 18px,
                #371906 20px
            );
            border-radius: 0 0 12px 12px;
            border: 3px solid #2b1305;
            box-shadow: inset 0 -10px 25px rgba(0, 0, 0, 0.7), 0 16px 30px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 2;
            overflow: visible;
        }

        /* Brass Iron Straps & Rivets on Chest Body */
        .gift-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 18px;
            width: 16px;
            height: 100%;
            background: linear-gradient(90deg, #8a6a1c, #ffd700 50%, #94721d);
            border-left: 2px solid #3d2a03;
            border-right: 2px solid #3d2a03;
            box-shadow: 102px 0 0 0 #ffd700, 100px 0 0 2px #3d2a03;
        }

        /* Gold Keyhole Lock Plate */
        .gift-box::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 34px;
            background: radial-gradient(circle at 50% 30%, #fff2a3 0%, #d4af37 60%, #856404 100%);
            border: 2px solid #382500;
            border-radius: 6px 6px 14px 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.6);
            z-index: 5;
        }

        /* Treasure Chest Curved Lid */
        .gift-lid {
            position: absolute;
            top: 15px;
            left: 10px;
            width: 180px;
            height: 50px;
            background: repeating-linear-gradient(
                180deg,
                #85451c 0px,
                #5e2d0e 16px,
                #3a1a06 18px
            );
            border-radius: 36px 36px 6px 6px;
            border: 3px solid #2b1305;
            box-shadow: inset 0 6px 15px rgba(255, 255, 255, 0.2), 0 8px 18px rgba(0, 0, 0, 0.5);
            z-index: 4;
            transform-origin: center top;
            transition: transform 0.8s cubic-bezier(0.2, 0.85, 0.3, 1.25);
            transform-style: preserve-3d;
        }

        /* Brass Straps on Lid */
        .gift-lid::before {
            content: '';
            position: absolute;
            top: 0;
            left: 22px;
            width: 18px;
            height: 100%;
            background: linear-gradient(90deg, #8a6a1c, #ffd700 50%, #94721d);
            border-left: 2px solid #3d2a03;
            border-right: 2px solid #3d2a03;
            border-radius: 20px 20px 0 0;
            box-shadow: 102px 0 0 0 #ffd700, 100px 0 0 2px #3d2a03;
        }

        /* Top Handle Ring */
        .gift-lid::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 14px;
            border: 3px solid #d4af37;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
        }

        /* Chest Shake / Unlocking Animation */
        .gift-container.shake .gift-box {
            animation: chestRattle 0.4s ease-in-out infinite;
        }

        .gift-container.shake .gift-lid {
            animation: lidRattle 0.4s ease-in-out infinite;
        }

        /* Chest 3D Open Flip Animation */
        .gift-container.opened .gift-lid {
            transform: translateY(-12px) rotateX(-115deg);
        }

        .gift-container.opened .gift-box {
            box-shadow: inset 0 20px 35px #ffe600, 0 15px 40px rgba(255, 215, 0, 0.6);
        }

        @keyframes chestRattle {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-5px) rotate(-1.5deg); }
            40% { transform: translateX(5px) rotate(1.5deg); }
            60% { transform: translateX(-3px) rotate(-1deg); }
            80% { transform: translateX(3px) rotate(1deg); }
        }

        @keyframes lidRattle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            30% { transform: translateY(-4px) rotate(-2deg); }
            70% { transform: translateY(-2px) rotate(2deg); }
        }

        /* ==================== REVEAL / PRIZE LIST (MOBILE OPTIMIZED) ==================== */
        .reveal-card {
            margin-top: 25px;
            opacity: 0;
            transform: translateY(15px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            pointer-events: none;
            width: 100%;
        }

        .reveal-card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .prize-title {
            font-size: 1rem;
            color: #00ffd0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(0, 255, 208, 0.5);
        }

        /* Scrollable container capped to viewport height */
        .prize-name {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: stretch;
            max-height: 240px;
            overflow-y: auto;
            padding: 6px 8px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 215, 0, 0.4) transparent;
        }

        .prize-name::-webkit-scrollbar {
            width: 6px;
        }

        .prize-name::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.4);
            border-radius: 10px;
        }

        .prize-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 1px solid rgba(255, 215, 0, 0.35);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0,0,0,0.3), inset 0 0 10px rgba(255, 215, 0, 0.08);
            backdrop-filter: blur(10px);
            animation: popIn 0.35s ease forwards;
            flex-shrink: 0;
        }

        .prize-badge {
            background: linear-gradient(45deg, #ffd700, #ff9900);
            color: #201400;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            white-space: nowrap;
        }

        .prize-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: right;
            margin-left: 8px;
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .disabled {
            cursor: not-allowed !important;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GLAMOUR REWARDS</h1>
        <p class="subtitle" id="status-text">Enter bill amount to unlock gifts (1 Gift per ₹1000)</p>

        <!-- Bill Amount Input -->
        <div class="bill-input-card" id="billInputSection">
            <input type="number" id="billAmount" placeholder="Enter Bill (₹)" min="0">
            <button onclick="setBillAmount()">Submit Bill</button>
        </div>

        <div class="gift-container" id="giftContainer" onclick="openGift()">
            <div class="gift-lid" id="giftLid"></div>
            <div class="gift-box"></div>
        </div>

        <div class="reveal-card" id="revealCard">
            <p class="prize-title" id="prizeTitle">🎉 Unlocked Rewards 🎉</p>
            <div class="prize-name" id="prizeName"></div>
        </div>
    </div>

    <script>
        const defaultGifts = [
            { name: "MAGIC LED BULB", weight: 20 },
            { name: "WATER BOTTLE",   weight: 20 },
            { name: "COFFEE MUG",    weight:  0 },
            { name: "CUP SET",       weight:  0 },
            { name: "LADIES BAG",    weight: 25 },
            { name: "UMBRELLA",      weight: 10 },
            { name: "TRAY",          weight: 20 },
            { name: "GENTS BAG",     weight: 10 },
            { name: "WALL CLOCK",    weight:  8 },
            { name: "WRIST WATCH",   weight:  0 },
            { name: "FAN",           weight:  0 }
        ];

        const oneTimeItems = ["WALL CLOCK", "CUP SET", "LADIES BAG", "FAN"];

        let currentGiftPool = [];
        let totalEligibleGifts = 0;
        let giftsRevealedCount = 0;
        let wonGiftsList = [];
        let isOpening = false;

        function setBillAmount() {
            const billInput = document.getElementById('billAmount');
            const amount = parseFloat(billInput.value);
            const statusText = document.getElementById('status-text');

            if (isNaN(amount) || amount < 1000) {
                alert("Minimum bill amount must be ₹1000 to earn a gift!");
                return;
            }

            totalEligibleGifts = Math.floor(amount / 1000);
            giftsRevealedCount = 0;
            wonGiftsList = [];

            currentGiftPool = JSON.parse(JSON.stringify(defaultGifts));

            const clockRef = currentGiftPool.find(g => g.name === "WALL CLOCK");
            if (clockRef) {
                clockRef.weight = (amount >= 1000 && amount <= 2999) ? 3 : 8;
            }

            document.getElementById('billInputSection').style.display = 'none';
            statusText.textContent = `Unlocked ${totalEligibleGifts} gift(s)! Tap chest to open Gift #1.`;
            document.getElementById('giftContainer').classList.remove('disabled');
        }

        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = 'Reward state will be lost.';
        });

        window.addEventListener('keydown', function (e) {
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || (e.metaKey && e.key === 'r')) {
                e.preventDefault();
            }
        });

        let touchStartClientY = 0;
        window.addEventListener('touchstart', function (e) {
            if (e.touches.length === 1) {
                touchStartClientY = e.touches[0].clientY;
            }
        }, { passive: false });

        window.addEventListener('touchmove', function (e) {
            const touchMoveClientY = e.touches[0].clientY;
            const touchDistanceY = touchMoveClientY - touchStartClientY;
            if (window.scrollY === 0 && touchDistanceY > 0) {
                e.preventDefault();
            }
        }, { passive: false });

        function getWeightedGift() {
            const totalWeight = currentGiftPool.reduce((sum, item) => sum + item.weight, 0);
            let selectedItemName = defaultGifts[0].name;

            if (totalWeight <= 0) {
                const fallbackGifts = ["MAGIC LED BULB", "WATER BOTTLE", "TRAY"];
                selectedItemName = fallbackGifts[Math.floor(Math.random() * fallbackGifts.length)];
            } else {
                let random = Math.random() * totalWeight;
                for (const gift of currentGiftPool) {
                    if (random < gift.weight) {
                        selectedItemName = gift.name;
                        break;
                    }
                    random -= gift.weight;
                }
            }

            if (oneTimeItems.includes(selectedItemName)) {
                const itemRef = currentGiftPool.find(g => g.name === selectedItemName);
                if (itemRef) itemRef.weight = 0;
            }

            return selectedItemName;
        }

        function openGift() {
            if (totalEligibleGifts === 0) {
                alert("Please enter a valid bill amount first!");
                return;
            }

            if (isOpening || giftsRevealedCount >= totalEligibleGifts) return;
            isOpening = true;

            const container = document.getElementById('giftContainer');
            const statusText = document.getElementById('status-text');
            const revealCard = document.getElementById('revealCard');
            const prizeNameText = document.getElementById('prizeName');

            container.classList.remove('opened');
            revealCard.classList.remove('show');

            container.classList.add('shake');
            statusText.textContent = `Unlocking chest ${giftsRevealedCount + 1} of ${totalEligibleGifts}...`;

            setTimeout(() => {
                container.classList.remove('shake');
                container.classList.add('opened');
                
                const winningPrize = getWeightedGift();
                giftsRevealedCount++;
                wonGiftsList.push(winningPrize);
                
                prizeNameText.innerHTML = wonGiftsList.map((item, idx) => `
                    <div class="prize-item">
                        <span class="prize-badge">Gift #${idx + 1}</span>
                        <span class="prize-label">${item}</span>
                    </div>
                `).join('');
                revealCard.classList.add('show');

                // Auto-scroll list to display latest item
                prizeNameText.scrollTo({
                    top: prizeNameText.scrollHeight,
                    behavior: 'smooth'
                });

                if (giftsRevealedCount < totalEligibleGifts) {
                    statusText.textContent = `Claimed Gift #${giftsRevealedCount}! Tap chest again for #${giftsRevealedCount + 1}.`;
                    isOpening = false;
                } else {
                    statusText.textContent = "All mystery rewards unlocked!";
                    container.classList.add('disabled');
                    isOpening = false;
                }
            }, 1200); 
        }
    </script>
</body>
</html>
