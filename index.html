<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Gift Reveal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1c29 0%, #10111a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Floating Particles Canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Confetti Burst Canvas */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .container {
            text-align: center;
            padding: 16px;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            position: relative;
        }

        /* Audio Toggle Button */
        .audio-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #ffd700;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .audio-toggle:hover {
            transform: scale(1.1);
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 65, 108, 0.3);
            animation: glowTitle 3s ease-in-out infinite alternate;
        }

        @keyframes glowTitle {
            0% { filter: drop-shadow(0 0 5px rgba(255, 65, 108, 0.4)); }
            100% { filter: drop-shadow(0 0 15px rgba(255, 75, 43, 0.8)); }
        }

        p.subtitle {
            color: #8a8dbe;
            margin-bottom: 20px;
            font-size: 0.95rem;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s ease;
        }

        /* Bill Input Section */
        .bill-input-card {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .bill-input-card input {
            background: #25283d;
            border: 1px solid #414568;
            color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            outline: none;
            width: 100%;
            max-width: 280px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .bill-input-card input:focus {
            border-color: #ff416c;
            box-shadow: 0 0 12px rgba(255, 65, 108, 0.4);
            transform: translateY(-2px);
        }

        .bill-input-card button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .bill-input-card button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
        }

        .bill-input-card button:active {
            transform: scale(0.97);
        }

        /* Treasure Chest Stage */
        .chest-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
            position: relative;
        }

        .chest-stage.hide {
            display: none;
        }

        /* Radiant Aura Light Beam Effect */
        .chest-aura {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, rgba(255, 65, 108, 0.2) 50%, transparent 75%);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            transition: all 0.8s ease;
            z-index: 1;
        }

        .chest-stage.opening .chest-aura {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.8);
            animation: pulseAura 1.5s infinite alternate;
        }

        @keyframes pulseAura {
            0% { transform: translate(-50%, -50%) scale(1.5); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(2.1); opacity: 1; }
        }

        .gift-container {
            position: relative;
            width: 180px;
            height: 160px;
            margin: 0 auto;
            cursor: pointer;
            perspective: 800px;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .gift-container:hover {
            transform: scale(1.05);
        }

        .gift-container::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 22px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.75) 0%, rgba(0, 150, 255, 0.25) 40%, transparent 75%);
            border-radius: 50%;
            z-index: 1;
        }

        .gift-box {
            position: relative;
            width: 160px;
            height: 90px;
            margin: 55px auto 0 auto;
            background: repeating-linear-gradient(180deg, #1e3799 0px, #0c2461 18px, #0a192f 20px);
            border-radius: 0 0 12px 12px;
            border: 3px solid #08101e;
            box-shadow: inset 0 -10px 25px rgba(0, 0, 0, 0.7), 0 14px 26px rgba(0, 0, 0, 0.6);
            z-index: 2;
        }

        .gift-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 18px;
            width: 16px;
            height: 100%;
            background: linear-gradient(90deg, #1b9cfc, #70a1ff 50%, #1e90ff);
            border-left: 2px solid #0c2461;
            border-right: 2px solid #0c2461;
            box-shadow: 108px 0 0 0 #70a1ff;
        }

        .gift-box::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 32px;
            background: radial-gradient(circle at 50% 30%, #a0c4ff 0%, #3a86ff 60%, #004e92 100%);
            border: 2px solid #08101e;
            border-radius: 6px 6px 14px 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.6);
            z-index: 5;
        }

        .gift-lid {
            position: absolute;
            top: 15px;
            left: 5px;
            width: 170px;
            height: 48px;
            background: repeating-linear-gradient(180deg, #2541b2 0px, #102a78 16px, #0a192f 18px);
            border-radius: 34px 34px 6px 6px;
            border: 3px solid #08101e;
            box-shadow: inset 0 6px 15px rgba(255, 255, 255, 0.2), 0 8px 18px rgba(0, 0, 0, 0.5);
            z-index: 4;
            transform-origin: center top;
            transition: transform 0.8s cubic-bezier(0.2, 0.85, 0.3, 1.25);
            transform-style: preserve-3d;
        }

        .gift-lid::before {
            content: '';
            position: absolute;
            top: 0;
            left: 18px;
            width: 18px;
            height: 100%;
            background: linear-gradient(90deg, #1b9cfc, #70a1ff 50%, #1e90ff);
            border-left: 2px solid #0c2461;
            border-right: 2px solid #0c2461;
            border-radius: 18px 18px 0 0;
            box-shadow: 110px 0 0 0 #70a1ff;
        }

        .gift-container.shake .gift-box {
            animation: chestRattle 0.2s ease-in-out infinite;
        }

        .gift-container.shake .gift-lid {
            animation: lidRattle 0.2s ease-in-out infinite;
        }

        .gift-container.opened .gift-lid {
            transform: translateY(-12px) rotateX(-115deg);
        }

        @keyframes chestRattle {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-5px) rotate(-1.5deg); }
            40% { transform: translateX(5px) rotate(1.5deg); }
            60% { transform: translateX(-3px) rotate(-1deg); }
            80% { transform: translateX(3px) rotate(1deg); }
        }

        @keyframes lidRattle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            30% { transform: translateY(-4px) rotate(-2deg); }
            70% { transform: translateY(-2px) rotate(2deg); }
        }

        /* Single Live Gift Reveal */
        .single-reveal {
            margin-top: 20px;
            opacity: 0;
            transform: translateY(10px) scale(0.9);
            transition: all 0.1s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            pointer-events: none;
            min-height: 52px;
        }

        .single-reveal.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .current-prize-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.04) 100%);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .badge-current {
            background: linear-gradient(45deg, #ffd700, #ff9900);
            color: #201400;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        /* Final Summary View */
        .summary-card {
            display: none;
            opacity: 0;
            transform: scale(0.92);
            transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 16px;
            padding: 20px 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
        }

        .summary-card.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .summary-title {
            font-size: 1.1rem;
            color: #00ffd0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 0 12px rgba(0, 255, 208, 0.5);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.85rem;
            font-weight: 700;
            text-align: left;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .summary-item.animate-in {
            opacity: 1;
            transform: translateY(0);
        }

        .summary-item:hover {
            border-color: #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
            transform: translateY(-2px);
        }

        .summary-badge {
            background: linear-gradient(45deg, #ffd700, #ff9900);
            color: #201400;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .summary-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #ffffff;
        }

        .disabled {
            cursor: not-allowed !important;
            opacity: 0.6;
        }

        /* Blinking Warning Caption Style */
        .blink-warning {
            font-weight: bold;
            color: #ff0000;
            animation: blinker 1s linear infinite;
            margin-top: 15px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Hidden Admin Trigger */
        .admin-trigger {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #414568;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s;
        }
        .admin-trigger:hover {
            color: #8a8dbe;
        }
    </style>
</head>
<body>

    <!-- Ambient Particles Canvas -->
    <canvas id="bgCanvas"></canvas>
    <!-- Confetti Explosion Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Sound Toggle Switch -->
    <button class="audio-toggle" id="audioToggleBtn" title="Toggle Sound">🔊</button>

    <div class="container">
        <h1>GLAMOUR'S REWARD SYSTEM</h1>
        <p class="subtitle" id="status-text">Enter bill amount to unlock gifts (1 Gift per ₹1000)</p>

        <!-- Bill Amount Input -->
        <div class="bill-input-card" id="billInputSection">
            <input type="number" id="billAmount" placeholder="Enter Bill Amount (₹)" min="1000" inputmode="numeric">
            <button onclick="setBillAmount()">Unlock Gifts</button>
        </div>

        <!-- Single Chest Stage -->
        <div class="chest-stage hide" id="chestStage">
            <div class="chest-aura"></div>
            <div class="gift-container" id="giftContainer" onclick="openGift()">
                <div class="gift-lid" id="giftLid"></div>
                <div class="gift-box"></div>
            </div>

            <div class="single-reveal" id="singleReveal">
                <div class="current-prize-pill" id="currentPrizeContent"></div>
            </div>
        </div>

        <!-- Final Summary View -->
        <div class="summary-card" id="summaryCard">
            <p class="summary-title">🎉 Your Won Rewards 🎉</p>
            <div class="summary-grid" id="summaryGrid"></div>
        </div>

        <!-- Blinking Warning Caption -->
        <div class="blink-warning">REFRESHING THE PAGE WILL INVALIDATE YOUR GIFT</div>

        <!-- Hidden Admin Feature Link -->
        <div class="admin-trigger" onclick="openAdminPanel()">⚙️ Admin Dashboard</div>
    </div>

    <script>
        /* =========================================================
           ADMIN CONFIGURATION & ITEM-WISE REVEAL TRACKER
        ======================================================== */
        const ADMIN_SECRET_CODE = "admin123"; // <-- CHANGE YOUR SECRET CODE HERE ANYTIME

        function openAdminPanel() {
            const enteredCode = prompt("Enter Admin Code to view daily item-wise reveals:");
            if (enteredCode === null) return;

            if (enteredCode === ADMIN_SECRET_CODE) {
                checkAndResetDailyCount();
                const totalToday = localStorage.getItem('total_gifts_revealed_today') || 0;
                const itemCounts = JSON.parse(localStorage.getItem('item_wise_reveals_today') || '{}');
                const lastResetDate = localStorage.getItem('admin_reset_date') || "Today";

                let report = `--- ADMIN DAILY REPORT (${lastResetDate}) ---\n\n`;
                report += `TOTAL GIFTS REVEALED: ${totalToday}\n`;
                report += `-----------------------------------------\n`;
                report += `ITEM-WISE BREAKDOWN:\n\n`;

                const itemsKeys = Object.keys(itemCounts);
                if (itemsKeys.length === 0) {
                    report += `No gifts have been revealed today yet.`;
                } else {
                    itemsKeys.forEach(itemName => {
                        report += `• ${itemName}: ${itemCounts[itemName]}\n`;
                    });
                }

                alert(report);
            } else {
                alert("Incorrect Admin Code!");
            }
        }

        function checkAndResetDailyCount() {
            const todayStr = new Date().toDateString();
            const storedDate = localStorage.getItem('admin_reset_date');
            if (storedDate !== todayStr) {
                localStorage.setItem('admin_reset_date', todayStr);
                localStorage.setItem('total_gifts_revealed_today', '0');
                localStorage.setItem('item_wise_reveals_today', JSON.stringify({}));
            }
        }

        /* =========================================================
            WEB AUDIO API SYNTHESIZER SOUND SYSTEM
        ======================================================== */
        let audioCtx = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        document.getElementById('audioToggleBtn').addEventListener('click', function() {
            isMuted = !isMuted;
            this.textContent = isMuted ? '🔇' : '🔊';
        });

        // Sound Effect 1: Button Click
        function playSoundClick() {
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // Sound Effect 2: Chest Rattle Sound
        let rattleInterval = null;
        function startRattleSound() {
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;

            let count = 0;
            rattleInterval = setInterval(() => {
                if (count > 10) { clearInterval(rattleInterval); return; }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120 + Math.random() * 60, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.06);
                count++;
            }, 100);
        }

        function stopRattleSound() {
            if (rattleInterval) clearInterval(rattleInterval);
        }

        // Sound Effect 3: Magical Fanfare Sound
        function playFanfareSound() {
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;

            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.12);

                gain.gain.setValueAtTime(0, audioCtx.currentTime + index * 0.12);
                gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + index * 0.12 + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.12 + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(audioCtx.currentTime + index * 0.12);
                osc.stop(audioCtx.currentTime + index * 0.12 + 0.4);
            });
        }

        /* =========================================================
            BACKGROUND FLOATING PARTICLES CANVAS
        ======================================================== */
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let bgParticles = [];

        function resizeBgCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBgCanvas);
        resizeBgCanvas();

        for (let i = 0; i < 40; i++) {
            bgParticles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                radius: Math.random() * 2 + 0.5,
                alpha: Math.random() * 0.6 + 0.2,
                speedY: -(Math.random() * 0.4 + 0.1),
                speedX: (Math.random() - 0.5) * 0.3
            });
        }

        function animateBgParticles() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgParticles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;

                if (p.y < -10) p.y = bgCanvas.height + 10;
                if (p.x < -10) p.x = bgCanvas.width + 10;
                if (p.x > bgCanvas.width + 10) p.x = -10;

                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
                bgCtx.fill();
            });
            requestAnimationFrame(animateBgParticles);
        }
        animateBgParticles();

        /* =========================================================
            CANVAS CONFETTI SYSTEM
        ======================================================== */
        const confettiCanvas = document.getElementById('confettiCanvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        let confettiParticles = [];

        function resizeConfettiCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfettiCanvas);
        resizeConfettiCanvas();

        function launchConfetti() {
            confettiParticles = [];
            const colors = ['#ffd700', '#ff416c', '#ff4b2b', '#00ffd0', '#1b9cfc', '#ffffff'];
            for (let i = 0; i < 110; i++) {
                confettiParticles.push({
                    x: confettiCanvas.width / 2,
                    y: confettiCanvas.height / 2 + 20,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 18,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.2,
                    gravity: 0.3,
                    alpha: 1
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let active = false;

            confettiParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.rotation += p.vRot;
                p.alpha -= 0.009;

                if (p.alpha > 0) {
                    active = true;
                    confettiCtx.save();
                    confettiCtx.translate(p.x, p.y);
                    confettiCtx.rotate(p.rotation);
                    confettiCtx.fillStyle = p.color;
                    confettiCtx.globalAlpha = Math.max(0, p.alpha);
                    confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    confettiCtx.restore();
                }
            });

            if (active) requestAnimationFrame(animateConfetti);
        }

        /* =========================================================
            ORIGINAL APPLICATION LOGIC
        ======================================================== */

        // Restrict page refresh/reload attempts
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F5' || (e.ctrlKey && e.key.toLowerCase() === 'r') || (e.metaKey && e.key.toLowerCase() === 'r')) {
                e.preventDefault();
                alert("Page refresh is restricted on this rewards page!");
            }
        });

        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
        });

        const defaultGifts = [
            { name: "MAGIC LED BULB", weight: 15 },
            { name: "WATER BOTTLE", weight: 15 },
            { name: "COFFEE MUG", weight: 0 },
            { name: "CUP SET", weight: 0 },
            { name: "LADIES BAG", weight: 25 },
            { name: "UMBRELLA", weight: 15 },
            { name: "TRAY", weight: 20 },
            { name: "GENTS BAG", weight: 15 },
            { name: "WALL CLOCK", weight: 9 },
            { name: "WRIST WATCH", weight: 0 },
            { name: "FAN", weight: 0 }
        ];

        const oneTimeItems = ["CUP SET", "LADIES BAG", "FAN"];

        let currentGiftPool = [];
        let totalEligibleGifts = 0;
        let wonGiftsList = [];
        let isOpening = false;
        let billAmountValue = 0;

        function setBillAmount() {
            playSoundClick();
            const billInput = document.getElementById('billAmount');
            const amount = parseFloat(billInput.value);
            const statusText = document.getElementById('status-text');

            if (isNaN(amount) || amount < 1000) {
                alert("Minimum bill amount must be ₹1000 to earn a gift!");
                return;
            }

            const lastAmount = localStorage.getItem('last_bill_amount');
            const lastTime = localStorage.getItem('last_bill_time');
            const currentTime = new Date().getTime();

            if (lastAmount && lastTime && parseFloat(lastAmount) === amount) {
                const elapsedSeconds = (currentTime - parseFloat(lastTime)) / 1000;
                if (elapsedSeconds < 70) {
                    const remaining = Math.ceil(70 - elapsedSeconds);
                    alert(`This bill amount was already entered recently. Please wait ${remaining} seconds before trying again.`);
                    return;
                }
            }

            localStorage.setItem('last_bill_amount', amount);
            localStorage.setItem('last_bill_time', currentTime);

            billAmountValue = amount;
            totalEligibleGifts = Math.floor(amount / 1000);
            wonGiftsList = [];

            if (amount >= 1000 && amount <= 1700) {
                currentGiftPool = [
                    { name: "MAGIC LED BULB", weight: 25 },
                    { name: "WATER BOTTLE", weight: 25 },
                    { name: "TRAY", weight: 20 },
                    { name: "UMBRELLA", weight: 15 },
                    { name: "WATER BOTTLE", weight: 25 },
                    { name: "TRAY", weight: 20 },
                ];
            } else {
                currentGiftPool = JSON.parse(JSON.stringify(defaultGifts));
                const clockRef = currentGiftPool.find(g => g.name === "WALL CLOCK");
                if (clockRef) {
                    clockRef.weight = (amount <= 2999) ? 8 : 9;
                }
            }

            document.getElementById('billInputSection').style.display = 'none';
            document.getElementById('chestStage').classList.remove('hide');
            statusText.textContent = `Unlocked ${totalEligibleGifts} gift(s)! Tap chest to reveal all.`;
            document.getElementById('giftContainer').classList.remove('disabled');
        }

        function getWeightedGift() {
            const totalWeight = currentGiftPool.reduce((sum, item) => sum + item.weight, 0);
            let selectedItemName = currentGiftPool[0].name;

            if (totalWeight <= 0) {
                const fallbackGifts = ["WATER BOTTLE", "UMBRELLA"];
                selectedItemName = fallbackGifts[Math.floor(Math.random() * fallbackGifts.length)];
            } else {
                let random = Math.random() * totalWeight;
                for (const gift of currentGiftPool) {
                    if (random < gift.weight) {
                        selectedItemName = gift.name;
                        break;
                    }
                    random -= gift.weight;
                }
            }

            if (oneTimeItems.includes(selectedItemName)) {
                const itemRef = currentGiftPool.find(g => g.name === selectedItemName);
                if (itemRef) itemRef.weight = 0;
            }

            return selectedItemName;
        }

        function openGift() {
            if (totalEligibleGifts === 0 || isOpening) return;
            isOpening = true;

            const container = document.getElementById('giftContainer');
            const statusText = document.getElementById('status-text');
            const singleReveal = document.getElementById('singleReveal');
            const currentPrizeContent = document.getElementById('currentPrizeContent');
            const chestStage = document.getElementById('chestStage');

            container.classList.remove('opened');
            singleReveal.classList.remove('show');

            chestStage.classList.add('opening');
            container.classList.add('shake');
            statusText.textContent = "Unlocking all your mystery gifts...";

            startRattleSound();

            setTimeout(() => {
                stopRattleSound();
                container.classList.remove('shake');
                container.classList.add('opened');

                playFanfareSound();
                launchConfetti();

                wonGiftsList = [];
                for (let i = 0; i < totalEligibleGifts; i++) {
                    wonGiftsList.push(getWeightedGift());
                }

                if (billAmountValue > 4000) {
                    if (!wonGiftsList.includes("WALL CLOCK")) {
                        const replaceIdx = Math.floor(Math.random() * wonGiftsList.length);
                        wonGiftsList[replaceIdx] = "WALL CLOCK";
                    }
                }

                if (billAmountValue > 8000) {
                    ["WALL CLOCK", "GENTS BAG"].forEach(item => {
                        let count = wonGiftsList.filter(g => g === item).length;
                        while (count < 2 && wonGiftsList.length > 0) {
                            const replaceIdx = Math.floor(Math.random() * wonGiftsList.length);
                            wonGiftsList[replaceIdx] = item;
                            count = wonGiftsList.filter(g => g === item).length;
                        }
                    });
                }

                // --- ITEM-WISE ADMIN COUNTER LOGIC ---
                checkAndResetDailyCount();
                let currentTotalToday = parseInt(localStorage.getItem('total_gifts_revealed_today') || '0', 10);
                let itemWiseCounts = JSON.parse(localStorage.getItem('item_wise_reveals_today') || '{}');

                wonGiftsList.forEach(giftName => {
                    currentTotalToday += 1;
                    itemWiseCounts[giftName] = (itemWiseCounts[giftName] || 0) + 1;
                });

                localStorage.setItem('total_gifts_revealed_today', currentTotalToday.toString());
                localStorage.setItem('item_wise_reveals_today', JSON.stringify(itemWiseCounts));
                // -------------------------------------

                currentPrizeContent.innerHTML = `
                    <span class="badge-current">All Unlocked</span>
                    <span>${totalEligibleGifts} Gift(s) Ready!</span>
                `;
                singleReveal.classList.add('show');

                setTimeout(() => {
                    chestStage.classList.add('hide');
                    const summaryCard = document.getElementById('summaryCard');
                    const summaryGrid = document.getElementById('summaryGrid');
                    summaryGrid.innerHTML = '';

                    wonGiftsList.forEach((giftName, idx) => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'summary-item';
                        itemDiv.innerHTML = `
                            <span class="summary-badge">#${idx + 1}</span>
                            <span class="summary-name">${giftName}</span>
                        `;
                        summaryGrid.appendChild(itemDiv);

                        setTimeout(() => {
                            itemDiv.classList.add('animate-in');
                        }, idx * 100);
                    });

                    summaryCard.classList.add('show');
                    statusText.textContent = "All gifts successfully revealed!";
                }, 1200);

            }, 2000);
        }
    </script>
</body>
</html>
